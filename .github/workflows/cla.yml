name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'issue_comment' && github.event.comment.body == 'recheck')
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/stanford-developers/steer-core/blob/main/CLA.md"
          branch: "main"
          allowlist: "nsiemons,dependabot[bot],github-actions[bot]"
          remote-organization-name: "stanford-developers"
          remote-repository-name: "steer-core"
          custom-notsigned-prcomment: >
            Thank you for your pull request! Before we can merge it, you need to sign our
            [Contributor License Agreement (CLA)](https://github.com/stanford-developers/steer-core/blob/main/CLA.md).
            steer-core uses a dual license (AGPL-3.0 + proprietary), so we need a CLA
            to ensure contributions can be distributed under both licenses.


            To sign, please post a comment in this PR stating:

            > I have read the CLA Document and I hereby sign the CLA


            You only need to sign once — it covers all future contributions.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
